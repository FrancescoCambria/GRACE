[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grace"
version = "0.1.0"
description = "Graph Rule Analysis and Classification Engine (GRACE)"
readme = "README.md"
requires-python = ">=3.10, <3.13"
authors = [
    { name = "Francesco Cambria" }
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "torch>=2.0.0",
    "sentence-transformers>=2.2.0",
    "deepctr-torch>=0.2.9",
    "neo4j>=5.0.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "google-genai>=0.1.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
tf = [
    "tensorflow>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "kge*"]
